<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Live Streaming</title>
</head>
<body>

<video id="video" controls autoplay width="100%"></video>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script>
if (Hls.isSupported()) {
  const video = document.getElementById('video');
  const hls = new Hls();
  hls.loadSource('https://o2.365koora.live/broadcast/o60Eok5V71gujhSQH3BhZg/1766842626/1766842365/1/premium.m3u8');
  hls.attachMedia(video);
}
</script>

</body>
</html>
