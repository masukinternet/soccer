<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Live Streaming</title>
</head>
<body>

<video id="video" controls autoplay width="100%"></video>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script>
if (Hls.isSupported()) {
  const video = document.getElementById('video');
  const hls = new Hls();
  hls.loadSource('https://t5.akhbarpress.net/broadcast/qYn3WZ_JkuPaiobZ_ATQiQ/1766841761/1766841500/1/premium.m3u8');
  hls.attachMedia(video);
}
</script>

</body>
</html>
